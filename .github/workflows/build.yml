# ساخت خودکار فایل APK روی سرورهای GitHub — یادآور صوتی شمسی (طراحی: یاسین مظفری)
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: unzip -q YadavarSouti-Android.zip -d project

      - name: Build APK
        run: |
          SETTINGS=$(find project -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: YadavarSouti-APK
          path: project/**/build/outputs/apk/debug/*.apk
